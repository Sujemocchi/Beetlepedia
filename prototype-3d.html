<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Goliathus regius 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600&family=Noto+Serif+KR:wght@600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-1: #1b2119;
    --bg-2: #0b0d0a;
    --panel: rgba(18, 22, 17, 0.8);
    --line: rgba(236, 230, 214, 0.14);

  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: radial-gradient(ellipse at 50% 40%, var(--bg-1), var(--bg-2) 70%);
    color: var(--text);

    margin: 0; font-family: "Noto Serif KR", serif; font-weight: 600;

  .panel {

  button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #140f0b; }
  label.opacity { display: none; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
  label.opacity.show { display: flex; }
  .info {
    position: fixed; right: 16px; bottom: 16px; text-align: right;

  }
  .info b { color: var(--text); font-weight: 600; }
  @media (max-width: 640px) { .info { bottom: auto; top: 96px; } }
</style>
<script type="importmap">
{

<body>

<header>

<div class="panel">
  <div class="group" role="group" aria-label="성별">

  </div>
  <button id="btn-rotate" aria-pressed="true">자동 회전</button>

  <div>모델 몸길이(뿔 포함) <b id="len">–</b></div>
  <div>실제 수컷 약 60–100 mm</div>
  <div>드래그: 회전 · 휠: 확대</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { GLTFExporter } from 'three/addons/exporters/GLTFExporter.js';

// 단위: 1 = 1 mm. +z가 머리 방향, +y가 위, +x는 몸의 옆쪽(좌우 대칭).
// 모든 치수는 reference/regius-top.webp(1080px 정사각)에서 측정했다.
// 사진 1px = 0.14 mm, 몸 중심축은 사진에서 약 2.75° 기울어져 있다.
const PHOTO = { size: 1080, scale: 0.14, origin: [591.4, 480], tilt: Math.atan(0.0481) };

// ---------- 렌더러 / 장면 ----------
const stage = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
stage.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.35;

const camera = new THREE.PerspectiveCamera(35, window.innerWidth / window.innerHeight, 1, 3000);
camera.position.set(135, 95, 150);
const ortho = new THREE.OrthographicCamera(-1, 1, 1, -1, 1, 1000);
ortho.up.set(0, 0, 1);
let activeCamera = camera;

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 10, 0);
controls.enableDamping = true;
controls.minDistance = 60;
controls.maxDistance = 500;
controls.maxPolarAngle = Math.PI * 0.49;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.8;

const key = new THREE.DirectionalLight(0xfff1dc, 2.6);
key.position.set(60, 150, 80);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
Object.assign(key.shadow.camera, { left: -100, right: 100, top: 100, bottom: -100, near: 10, far: 400 });
key.shadow.radius = 6;
scene.add(key);
const rim = new THREE.DirectionalLight(0x9fc3ff, 1.1);
rim.position.set(-90, 60, -120);
scene.add(rim);
scene.add(new THREE.HemisphereLight(0xdfe7d4, 0x2a2016, 0.6));

const ground = new THREE.Mesh(new THREE.CircleGeometry(240, 64), new THREE.ShadowMaterial({ opacity: 0.45 }));
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

// ---------- 수학 도우미 ----------
const sgnPow = (v, p) => Math.sign(v) * Math.pow(Math.abs(v), p);
const clamp = THREE.MathUtils.clamp;

// 단조 3차 보간 (Fritsch–Carlson): 측정표 [[z, 값], ...]를 매끄럽고 튀지 않게 잇는다.
function mono(pts) {
  const xs = pts.map(p => p[0]), ys = pts.map(p => p[1]), n = pts.length;
  const d = [], m = new Array(n);
  for (let i = 0; i < n - 1; i++) d.push((ys[i + 1] - ys[i]) / (xs[i + 1] - xs[i]));
  m[0] = d[0]; m[n - 1] = d[n - 2];
  for (let i = 1; i < n - 1; i++) m[i] = d[i - 1] * d[i] <= 0 ? 0 : (d[i - 1] + d[i]) / 2;
  for (let i = 0; i < n - 1; i++) {
    if (d[i] === 0) { m[i] = m[i + 1] = 0; continue; }
    const a = m[i] / d[i], b = m[i + 1] / d[i], s = a * a + b * b;
    if (s > 9) { const t = 3 / Math.sqrt(s); m[i] = t * a * d[i]; m[i + 1] = t * b * d[i]; }
  }
  return x => {
    if (x <= xs[0]) return ys[0];
    if (x >= xs[n - 1]) return ys[n - 1];
    let i = 0;
    while (x > xs[i + 1]) i++;
    const h = xs[i + 1] - xs[i], t = (x - xs[i]) / h, t2 = t * t, t3 = t2 * t;
    return (2 * t3 - 3 * t2 + 1) * ys[i] + (t3 - 2 * t2 + t) * h * m[i]
      + (-2 * t3 + 3 * t2) * ys[i + 1] + (t3 - t2) * h * m[i + 1];
  };
}
function rng(seed) {
  return () => {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

// ---------- 로프트 형상 ----------
// 위에서 본 반폭 halfW(z), 윗면 높이 top(z), 아랫면 높이 bottom(z)로 단면을 z 방향으로 이어 붙인다.
// UV는 위에서 내려다본 평면 투영(mm 좌표 → 텍스처)이라 무늬를 mm 단위로 그대로 그릴 수 있다.
function loft({ z0, z1, halfW, top, bottom, mid = 0.35, ex = 0.5, ey = 0.7, rings = 220, seg = 128, uvBox, underside = 0.12, capW = 8 }) {
  const pos = [], uv = [], idx = [];
  for (let i = 0; i <= rings; i++) {
    const z = z0 + (z1 - z0) * (i / rings);
    const w = Math.max(0, halfW(z));
    const f = Math.pow(clamp(w / capW, 0, 1), 0.5);
    const yb = bottom(z), yt = top(z), ym = yb + (yt - yb) * mid;
    for (let j = 0; j <= seg; j++) {
      const a = (j / seg) * Math.PI * 2;
      const c = Math.cos(a), s = Math.sin(a);
      const x = w * sgnPow(c, ex);
      const y = s >= 0 ? ym + (yt - ym) * f * Math.pow(s, ey) : ym - (ym - yb) * f * Math.pow(-s, 0.8);
      pos.push(x, y, z);
      uv.push((x - uvBox.x0) / (uvBox.x1 - uvBox.x0), (z - uvBox.z0) / (uvBox.z1 - uvBox.z0));
    }
  }
  for (let i = 0; i < rings; i++) {
    for (let j = 0; j < seg; j++) {
      const a = i * (seg + 1) + j, b = a + seg + 1;
      idx.push(a, a + 1, b, b, a + 1, b + 1);
    }
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  geo.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
  geo.setIndex(idx);
  geo.computeVertexNormals();
  const nrm = geo.attributes.normal, col = new Float32Array(nrm.count * 3);
  for (let i = 0; i < nrm.count; i++) {
    const t = THREE.MathUtils.smoothstep(nrm.getY(i), -0.35, 0.2);
    col[i * 3] = col[i * 3 + 1] = col[i * 3 + 2] = underside + (1 - underside) * t;
  }
  geo.setAttribute('color', new THREE.BufferAttribute(col, 3));
  return geo;
}

// ---------- mm 단위 캔버스 ----------
function mmCanvas(box, px) {
  const W = px, H = Math.round(px * (box.z1 - box.z0) / (box.x1 - box.x0));
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  const ctx = c.getContext('2d');
  const k = W / (box.x1 - box.x0);
  // 캔버스 위쪽 = 앞쪽(+z), 오른쪽 = +x
  ctx.setTransform(k, 0, 0, -k, -box.x0 * k, box.z1 * k);
  ctx.lineJoin = 'round';
  return { c, ctx };
}
function finishTexture(c, ctx, noise) {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  const img = ctx.getImageData(0, 0, c.width, c.height), d = img.data, r = rng(7);
  for (let i = 0; i < d.length; i += 4) {
    const n = (r() - 0.5) * noise;
    d[i] += n; d[i + 1] += n; d[i + 2] += n;
  }
  ctx.putImageData(img, 0, 0);
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = 8;
  return tex;
}
// 안쪽 inner(z), 바깥쪽 outer(z) 가장자리 사이를 zTop~zBot 구간에서 채운다
function strip(ctx, zTop, zBot, inner, outer, sign = 1, step = 0.1) {
  ctx.beginPath();
  for (let z = zTop; z >= zBot; z -= step) ctx.lineTo(sign * inner(z), z);
  for (let z = zBot; z <= zTop; z += step) ctx.lineTo(sign * outer(z), z);
  ctx.closePath();
  ctx.fill();
}

// ---------- 색 ----------
const CREAM = '#ebe8da';
const CREAM_WARM = '#e6ddc2';
const STRIPE = '#200c09';   // 앞가슴등판 줄무늬: 검붉은 흑갈색
const VELVET_BLACK = '#0d0c0b';
const TAN = '#c9a25a';

// ================= 앞가슴등판 =================
// 사진 y 283–499 px 구간에서 측정한 반폭 (mm)
const proW = mono([[-2.7, 0], [-2.2, 2.8], [-1.1, 8.4], [0.7, 13.3], [3, 16.5], [5.5, 18.3], [8.4, 19.3],
  [11.8, 19.5], [15.4, 18.5], [19.7, 16.5], [22.7, 14], [25.2, 9.1], [26.6, 6.3], [27.3, 2.8], [27.9, 0]]);
const proTop = mono([[-2.7, 22.4], [0, 22.9], [5, 23.3], [10, 23.3], [16, 22.3], [22, 20], [26, 17.8], [27.9, 16.6]]);
const PRO_BOX = { x0: -21, x1: 21, z0: -4, z1: 30 };

function pronotumTexture() {
  const { c, ctx } = mmCanvas(PRO_BOX, 1400);
  ctx.fillStyle = CREAM;
  ctx.fillRect(PRO_BOX.x0, PRO_BOX.z0, PRO_BOX.x1 - PRO_BOX.x0, PRO_BOX.z1 - PRO_BOX.z0);
  // 표면의 옅은 얼룩
  const r = rng(3);
  for (let i = 0; i < 260; i++) {
    ctx.fillStyle = `rgba(120,110,80,${0.05 + r() * 0.12})`;
    ctx.beginPath();
    ctx.arc((r() - 0.5) * 38, -2 + r() * 30, 0.05 + r() * 0.25, 0, Math.PI * 2);
    ctx.fill();
  }
  // 줄무늬 3쌍: 앞 가장자리에서 시작해 부채꼴로 퍼지며, 가운데 쌍이 가장 길고 넓다.
  const stripes = [
    { top: 29, bot: 2.8,
      inner: mono([[2.8, 2.4], [3.2, 1.7], [4, 1.3], [10, 1.1], [29, 0.8]]),
      outer: mono([[2.8, 2.6], [3.2, 4.2], [4, 5.6], [5.6, 7.0], [8.4, 7.9], [11.8, 7.9], [16.8, 6.9], [21, 5.6], [23.8, 3.9], [26.6, 1.9], [29, 1.2]]) },
    { top: 27.5, bot: 11.0,
      inner: mono([[11.0, 12.3], [11.8, 11.0], [13.5, 10.0], [16.8, 8.6], [21, 7.0], [25.2, 5.4], [27.5, 3.4]]),
      outer: mono([[11.0, 13.3], [11.8, 14.0], [13.5, 14.2], [16.8, 13.2], [21, 11.0], [25.2, 7.0], [27.5, 4.4]]) },
    { top: 26, bot: 17.4,
      inner: mono([[17.4, 14.6], [18, 14.0], [19.5, 13.0], [21.5, 11.8], [23.5, 10.2], [26, 7.8]]),
      outer: mono([[17.4, 14.8], [18, 15.0], [19.5, 14.6], [21.5, 13.6], [23.5, 12.2], [26, 9.2]]) },
  ];
  ctx.fillStyle = STRIPE;
  for (const s of stripes) for (const side of [-1, 1]) strip(ctx, s.top, s.bot, s.inner, s.outer, side, 0.05);
  return finishTexture(c, ctx, 10);
}

// ================= 딱지날개 =================
const elyW = mono([[-47.9, 0], [-47.3, 8.4], [-46.5, 14], [-44.8, 17.6], [-42, 19.9], [-37.8, 21.3], [-30.8, 22.3],
  [-16.8, 23.1], [-2.8, 23.2], [4.2, 23.1], [6, 22.6], [8, 20], [9, 14], [10, 0]]);
const elyTop = mono([[-47.9, 11], [-44, 15], [-38, 18.5], [-30, 21.5], [-20, 23.5], [-10, 23.8], [0, 22.8], [6, 21], [10, 18]]);
const elyBot = mono([[-47.9, 9.5], [-40, 8], [-30, 7], [10, 7]]);
const ELY_BOX = { x0: -24, x1: 24, z0: -49, z1: 11 };

// 가운데 흰 무늬의 반폭 (봉합선 기준, mm) — 사진 y 455–822 px 측정값
const whiteW = mono([[-50, 3.6], [-47.9, 3.6], [-44.8, 4.2], [-42, 4.9], [-36.4, 6.3], [-30.8, 8.7], [-28, 10.1],
  [-22.4, 12.9], [-16.8, 14.0], [-11.2, 14.0], [-5.6, 14.3], [0, 15.8], [3.5, 16.1], [11, 16.1]]);

function elytraTexture() {
  const { c, ctx } = mmCanvas(ELY_BOX, 2048);
  ctx.fillStyle = VELVET_BLACK;
  ctx.fillRect(ELY_BOX.x0, ELY_BOX.z0, ELY_BOX.x1 - ELY_BOX.x0, ELY_BOX.z1 - ELY_BOX.z0);

  // 흰 무늬 가장자리: z −6 ~ −30 구간은 찢긴 레이스처럼 톱니와 떨어진 점이 있다.
  const lace = z => Math.pow(clamp(Math.sin(Math.PI * (z + 31) / 26), 0, 1), 0.7);
  for (const side of [-1, 1]) {
    const r = rng(side > 0 ? 11 : 23);
    const notches = [];
    for (let z = -5; z > -31; z -= 0.45 + r() * 0.9) {
      notches.push({ z, w: 0.25 + r() * 0.7, d: (0.35 + r() * 0.9) * 2.1 });
    }
    const edge = z => {
      let e = whiteW(z);
      const a = lace(z);
      for (const n of notches) {
        const t = Math.abs(z - n.z) / n.w;
        if (t < 1) e -= a * n.d * (1 - t * t);
      }
      return e;
    };
    ctx.fillStyle = CREAM;
    strip(ctx, 11, -50, () => 0, edge, side, 0.04);

    // 가장자리 바깥의 흰 점
    for (let i = 0; i < 110; i++) {
      const z = -29 + r() * 24;
      const a = lace(z);
      if (a < 0.15) continue;
      const x = whiteW(z) + (0.3 + r() * 2.6) * a;
      ctx.beginPath();
      ctx.ellipse(side * x, z, 0.12 + r() * 0.45 * a, 0.1 + r() * 0.25, 0, 0, Math.PI * 2);
      ctx.fill();
    }
    // 어깨의 황갈색 막
    ctx.fillStyle = TAN;
    ctx.beginPath();
    ctx.ellipse(side * 17.8, 3.6, 1.8, 0.7, side * -0.5, 0, Math.PI * 2);
    ctx.fill();
  }

  // 작은방패판: 옅은 황갈색 삼각형, 테두리는 갈색, 끝은 검다.
  const scut = [[-5.0, -1.8], [-3.2, -6], [-1.2, -11], [0, -13.7], [1.2, -11], [3.2, -6], [5.0, -1.8]];
  ctx.beginPath();
  scut.forEach(([x, z]) => ctx.lineTo(x, z));
  ctx.closePath();
  ctx.fillStyle = CREAM_WARM;
  ctx.fill();
  ctx.lineWidth = 0.28;
  ctx.strokeStyle = '#6b5433';
  ctx.stroke();
  ctx.fillStyle = '#1a120c';
  ctx.beginPath();
  ctx.moveTo(-0.55, -12.3); ctx.lineTo(0, -13.9); ctx.lineTo(0.55, -12.3); ctx.closePath();
  ctx.fill();

  // 봉합선: 작은방패판 끝에서 날개 끝까지, 뒤로 갈수록 조금 굵어진다
  ctx.fillStyle = VELVET_BLACK;
  strip(ctx, -13.7, -49, () => 0, z => 0.16 + 0.14 * clamp((-z - 13.7) / 34, 0, 1), 1, 0.2);
  strip(ctx, -13.7, -49, () => 0, z => 0.16 + 0.14 * clamp((-z - 13.7) / 34, 0, 1), -1, 0.2);
  return finishTexture(c, ctx, 12);
}

// ================= 재질 =================
// 벨벳: 검은 부분이 회색으로 뜨지 않도록 sheen은 약하게
const velvet = map => new THREE.MeshPhysicalMaterial({
  map, vertexColors: true, roughness: 0.95, metalness: 0,
  sheen: 0.35, sheenColor: new THREE.Color(0x8c887c), sheenRoughness: 0.6,
});
const matElytra = velvet(elytraTexture());
const matPronotum = velvet(pronotumTexture());
const matHead = new THREE.MeshPhysicalMaterial({
  color: 0xe9e5d5, vertexColors: true, roughness: 0.75, sheen: 0.6, sheenColor: new THREE.Color(0xffffff),
});
const matCuticle = new THREE.MeshPhysicalMaterial({
  color: 0x14170f, roughness: 0.32, metalness: 0.1, clearcoat: 0.8, clearcoatRoughness: 0.3,
});
const matUnder = new THREE.MeshPhysicalMaterial({ color: 0x1a1612, roughness: 0.6, clearcoat: 0.3 });
const matEye = new THREE.MeshPhysicalMaterial({ color: 0x9c5518, roughness: 0.15, clearcoat: 1 });
const matHair = new THREE.MeshStandardMaterial({ color: 0xc99a45, roughness: 1 });
const allMaterials = [matElytra, matPronotum, matHead, matCuticle, matUnder, matEye, matHair];

function mesh(geo, mat) {
  const m = new THREE.Mesh(geo, mat);
  m.castShadow = true;
  m.receiveShadow = true;
  return m;
}

// ================= 몸통 =================
const beetle = new THREE.Group();
beetle.name = 'Goliathus_regius';
scene.add(beetle);
const body = new THREE.Group();
beetle.add(body);

const elytra = mesh(loft({
  z0: -47.9, z1: 10, halfW: elyW, top: elyTop, bottom: elyBot,
  mid: 0.4, ex: 0.32, ey: 0.6, rings: 260, seg: 160, uvBox: ELY_BOX, capW: 10,
}), matElytra);
elytra.name = 'elytra';

const pronotum = mesh(loft({
  z0: -2.7, z1: 27.9, halfW: proW, top: proTop, bottom: () => 11,
  mid: 0.3, ex: 0.5, ey: 0.65, rings: 180, seg: 140, uvBox: PRO_BOX, capW: 8,
}), matPronotum);
pronotum.name = 'pronotum';

const thorax = mesh(new THREE.SphereGeometry(1, 40, 20).scale(11, 3, 14).translate(0, 8.5, 10), matUnder);
body.add(elytra, pronotum, thorax);

// ================= 머리 =================
const headMale = new THREE.Group(); headMale.name = 'head_male';
const headFemale = new THREE.Group(); headFemale.name = 'head_female';
body.add(headMale, headFemale);

const HEAD_BOX = { x0: -8, x1: 8, z0: 20, z1: 43 };
headMale.add(mesh(loft({
  z0: 22, z1: 41.6,
  halfW: mono([[22, 5.5], [26, 5.8], [27.9, 6.3], [29.5, 6.0], [31, 5.4], [32.5, 4.6], [34, 3.8], [36, 3.1], [38, 2.6], [40, 2.1], [41, 1.6], [41.6, 0]]),
  top: mono([[22, 16.5], [28, 17.4], [32, 16.8], [36, 16.4], [40, 16.8], [41.6, 16.8]]),
  bottom: mono([[22, 9.5], [30, 10.5], [36, 12], [41.6, 14.5]]),
  mid: 0.4, ex: 0.7, ey: 0.8, rings: 90, seg: 64, uvBox: HEAD_BOX, underside: 0.35, capW: 3,
}), matHead));

// 테이퍼진 관 (뿔, 더듬이, 발톱)
function tube(points, r0, r1, mat, target) {
  const curve = new THREE.CatmullRomCurve3(points.map(p => new THREE.Vector3(...p)));
  const segs = 40, radial = 14;
  const geo = new THREE.TubeGeometry(curve, segs, r0, radial, false);
  const pos = geo.attributes.position, c = new THREE.Vector3(), p = new THREE.Vector3();
  for (let i = 0; i <= segs; i++) {
    curve.getPointAt(i / segs, c);
    const k = THREE.MathUtils.lerp(1, r1 / r0, i / segs);
    for (let j = 0; j <= radial; j++) {
      const idx = i * (radial + 1) + j;
      p.fromBufferAttribute(pos, idx).sub(c).multiplyScalar(k).add(c);
      pos.setXYZ(idx, p.x, p.y, p.z);
    }
  }
  geo.computeVertexNormals();
  target.add(mesh(geo, mat));
  const cap = mesh(new THREE.SphereGeometry(r1, 14, 10), mat);
  cap.position.copy(curve.getPointAt(1));
  target.add(cap);
}

// Y자 뿔: 흰 머리 끝에서 두 갈래의 굵고 검은 가지가 앞쪽 위로 벌어진다.
for (const side of [-1, 1]) {
  tube([[side * 0.9, 16.6, 40.2], [side * 3.0, 18.6, 43.4], [side * 5.6, 21, 46.2]], 1.55, 1.35, matCuticle, headMale);
  // 머리 옆의 흰 돌기
  tube([[side * 2.9, 15.8, 34.2], [side * 4.0, 16.4, 35.2], [side * 4.6, 16.9, 35.8]], 0.7, 0.25, matHead, headMale);
}

// 암컷: 뿔이 없고 넓은 쐐기형 머리
headFemale.add(mesh(loft({
  z0: 22, z1: 36.4,
  halfW: mono([[22, 5.5], [27, 6.2], [30, 6.4], [33, 6.0], [35, 5.0], [36.4, 0]]),
  top: mono([[22, 15], [28, 15], [33, 13.5], [36.4, 12]]),
  bottom: mono([[22, 9], [30, 10], [36.4, 11]]),
  mid: 0.45, ex: 0.55, ey: 0.8, rings: 70, seg: 64, uvBox: HEAD_BOX, underside: 0.35, capW: 4,
}), matCuticle));

// ================= 좌우 부속지 =================
// 오른쪽(+x)으로 만든 부품을 scale.x = -1 그룹에 넣어 반대쪽을 만든다.
const up = new THREE.Vector3(0, 1, 0);
function basisMesh(geo, mat, a, b) {
  const dir = new THREE.Vector3().subVectors(b, a);
  const L = dir.length(); dir.normalize();
  const zA = up.clone().sub(dir.clone().multiplyScalar(up.dot(dir))).normalize();
  const xA = new THREE.Vector3().crossVectors(dir, zA);
  const m = mesh(geo(L), mat);
  m.quaternion.setFromRotationMatrix(new THREE.Matrix4().makeBasis(xA, dir, zA));
  m.position.copy(a);
  return m;
}
// a→b를 잇는 원기둥 (flat < 1이면 위아래로 납작)
function limb(group, a, b, r0, r1, flat = 1) {
  group.add(basisMesh(L => new THREE.CylinderGeometry(r1, r0, L, 16).scale(1, 1, flat).translate(0, L / 2, 0), matCuticle, a, b));
  const j = mesh(new THREE.SphereGeometry(1, 14, 10).scale(r1, r1 * flat, r1), matCuticle);
  j.position.copy(b);
  group.add(j);
}
// 종아리마디 바깥쪽 가시
function teeth(group, a, b, n, len, from = 0.35) {
  const dir = new THREE.Vector3().subVectors(b, a).normalize();
  const out = new THREE.Vector3().crossVectors(dir, up).normalize();
  if (out.x < 0) out.negate();
  for (let i = 0; i < n; i++) {
    const t = from + (1 - from) * (i + 0.5) / n;
    const p = a.clone().lerp(b, t);
    const tip = p.clone().add(out.clone().multiplyScalar(len)).add(dir.clone().multiplyScalar(len * 0.5));
    group.add(basisMesh(L => new THREE.ConeGeometry(len * 0.28, L, 8).translate(0, L / 2, 0), matCuticle, p, tip));
  }
}
// 뒤쪽 가장자리의 황갈색 털 뭉치
function fringe(group, a, b, r) {
  const dir = new THREE.Vector3().subVectors(b, a).normalize();
  const back = new THREE.Vector3(0, 0, -1).sub(dir.clone().multiplyScalar(-dir.z)).normalize();
  const off = back.multiplyScalar(r * 0.75).add(new THREE.Vector3(0, -r * 0.3, 0));
  group.add(basisMesh(L => new THREE.SphereGeometry(1, 16, 10).scale(r * 0.7, L / 2 * 0.8, r * 0.3).translate(0, L / 2, 0),
    matHair, a.clone().add(off), b.clone().add(off)));
}
// 발목마디 5개(톱니 모양 원뿔) + 갈고리 발톱 2개
function tarsus(group, a, b) {
  const dir = new THREE.Vector3().subVectors(b, a);
  const L = dir.length(); dir.normalize();
  const segL = L / 5;
  for (let i = 0; i < 5; i++) {
    const p0 = a.clone().add(dir.clone().multiplyScalar(i * segL));
    const p1 = a.clone().add(dir.clone().multiplyScalar((i + 1) * segL));
    const r = 0.95 - i * 0.05;
    group.add(basisMesh(l => new THREE.CylinderGeometry(r, r * 0.5, l, 10).translate(0, l / 2, 0), matCuticle, p0, p1));
  }
  const out = new THREE.Vector3().crossVectors(dir, up).normalize();
  for (const s of [-1, 1]) {
    const c1 = b.clone().add(dir.clone().multiplyScalar(1.6)).add(out.clone().multiplyScalar(s * 0.9));
    const c2 = c1.clone().add(dir.clone().multiplyScalar(0.9)).add(out.clone().multiplyScalar(s * 0.3)).add(new THREE.Vector3(0, -1.4, 0));
    tube([b.toArray(), c1.toArray(), c2.toArray()], 0.45, 0.12, matCuticle, group);
  }
}

// 다리 관절 좌표 (x, y, z mm) — 위에서 본 위치는 사진에서 측정, 높이는 추정
const V = (x, y, z) => new THREE.Vector3(x, y, z);
const LEGS = {
  front: { root: V(11, 8, 9), knee: V(39.5, 10, 29.4), ankle: V(45.6, 4, 40.9), tip: V(53.3, 0.8, 56),
    femur: [2.9, 2.5, 0.5], tibia: [1.0, 1.3], teeth: 4, hair: false },
  mid:   { root: V(10, 5.5, 5.8), knee: V(41.4, 9, -5.6), ankle: V(52, 3.5, -12.6), tip: V(61.9, 0.8, -21.7),
    femur: [2.1, 1.7, 0.6], tibia: [1.0, 1.35], teeth: 3, hair: 'femur' },
  hind:  { root: V(10, 5.5, -8), knee: V(23.2, 7.5, -17.5), ankle: V(27.9, 3.5, -37.5), tip: V(35.8, 0.8, -54.9),
    femur: [2.1, 1.9, 0.6], tibia: [1.25, 1.55], teeth: 3, hair: 'tibia' },
};

const sides = [], legs = [];
for (const side of [-1, 1]) {
  const s = new THREE.Group();
  s.scale.x = side;
  s.userData.side = side;
  body.add(s);
  sides.push(s);

  // 눈 (주황빛 갈색)
  const eye = mesh(new THREE.SphereGeometry(1, 20, 14).scale(1.3, 1.5, 1.6), matEye);
  eye.position.set(6.4, 13.4, 28.4);
  s.add(eye);

  // 더듬이: 짧은 자루 + 부채꼴 곤봉 3장
  const ant = new THREE.Group();
  ant.position.set(3.8, 13.2, 31.5);
  s.add(ant);
  tube([[0, 0, 0], [3.4, 0.4, -0.6], [6.6, 0.3, -2.1]], 0.5, 0.45, matCuticle, ant);
  const clubBase = V(6.6, 0.3, -2.1);
  for (const [dx, dy, dz] of [[4.6, 0.6, 2.4], [5.0, 0.2, 0.6], [4.4, -0.2, -1.1]]) {
    ant.add(basisMesh(L => new THREE.SphereGeometry(1, 14, 10).scale(0.9, L / 2, 0.35).translate(0, L / 2, 0),
      matCuticle, clubBase, clubBase.clone().add(V(dx, dy, dz))));
  }
  s.userData.antenna = ant;

  // 다리
  for (const [name, L] of Object.entries(LEGS)) {
    const g = new THREE.Group();
    g.name = `leg_${name}_${side > 0 ? 'R' : 'L'}`;
    g.position.copy(L.root);
    g.userData.y0 = L.root.y;
    s.add(g);
    const o = V(0, 0, 0), knee = L.knee.clone().sub(L.root), ankle = L.ankle.clone().sub(L.root), tip = L.tip.clone().sub(L.root);
    g.add(mesh(new THREE.SphereGeometry(2.6, 14, 10), matCuticle));
    limb(g, o, knee, L.femur[0], L.femur[1], L.femur[2]);
    limb(g, knee, ankle, L.tibia[0], L.tibia[1]);
    teeth(g, knee, ankle, L.teeth, 1.8);
    if (L.hair === 'femur') fringe(g, o.clone().lerp(knee, 0.35), knee, L.femur[1]);
    if (L.hair === 'tibia') fringe(g, knee, ankle, L.tibia[1]);
    tarsus(g, ankle, tip);
    // 삼각 보행: 오른쪽 앞·뒤 + 왼쪽 가운데 / 나머지
    legs.push({ g, phase: ((side > 0) === (name !== 'mid')) ? 0 : Math.PI });
  }
}

// ================= 크기 =================
function updateLength() {
  const box = new THREE.Box3();
  for (const m of [elytra, pronotum, headMale.visible ? headMale : headFemale]) box.expandByObject(m);
  document.getElementById('len').textContent = `${Math.round(box.max.z - box.min.z)} mm`;
}

// ================= UI =================
const $ = id => document.getElementById(id);

// 사진 비교: 위에서 본 정사영 카메라를 사진과 같은 축척·기울기로 맞춘다
const compareEl = $('compare');
let mode = 'orbit'; // orbit | top | compare
function layoutOrtho() {
  const W = window.innerWidth, H = window.innerHeight;
  const S = Math.min(W, H) * 0.96, d = S / PHOTO.size;
  const left = (W - S) / 2, topPx = (H - S) / 2;
  const [ox, oy] = PHOTO.origin;
  Object.assign(compareEl.style, { left: left + 'px', top: topPx + 'px', width: S + 'px', height: S + 'px' });
  const img = compareEl.firstElementChild;
  img.style.transformOrigin = `${ox / PHOTO.size * 100}% ${oy / PHOTO.size * 100}%`;
  img.style.transform = `rotate(${-PHOTO.tilt}rad)`;
  // 화면 중심에 오는 모델 좌표 (화면 오른쪽 = −x, 화면 위 = +z)
  const Ox = left + ox * d, Oy = topPx + oy * d;
  const mmPerPx = PHOTO.scale / d;
  const xc = -(W / 2 - Ox) * mmPerPx, zc = (Oy - H / 2) * mmPerPx;
  ortho.left = -W / 2 * mmPerPx; ortho.right = W / 2 * mmPerPx;
  ortho.top = H / 2 * mmPerPx; ortho.bottom = -H / 2 * mmPerPx;
  ortho.position.set(xc, 400, zc);
  ortho.lookAt(xc, 0, zc);
  ortho.updateProjectionMatrix();
}
function setMode(m) {
  mode = m;
  activeCamera = m === 'orbit' ? camera : ortho;
  controls.enabled = m === 'orbit';
  compareEl.style.display = m === 'compare' ? 'block' : 'none';
  $('btn-top').setAttribute('aria-pressed', m === 'top');
  $('btn-compare').setAttribute('aria-pressed', m === 'compare');
  $('opacity-wrap').classList.toggle('show', m === 'compare');
  if (m !== 'orbit') {
    walking = false;
    $('btn-walk').setAttribute('aria-pressed', false);
    layoutOrtho();
  }
}

function setSex(male) {
  headMale.visible = male;
  headFemale.visible = !male;
  $('btn-male').setAttribute('aria-pressed', male);
  $('btn-female').setAttribute('aria-pressed', !male);
  updateLength();
}
$('btn-male').onclick = () => setSex(true);
$('btn-female').onclick = () => setSex(false);

let walking = false;
function toggle(btn, fn) {
  btn.onclick = () => {
    const on = btn.getAttribute('aria-pressed') !== 'true';
    btn.setAttribute('aria-pressed', on);
    fn(on);
  };
}
toggle($('btn-rotate'), on => { controls.autoRotate = on; });
toggle($('btn-walk'), on => {
  if (on && mode !== 'orbit') setMode('orbit');
  walking = on;
  $('btn-walk').setAttribute('aria-pressed', on);
});
toggle($('btn-wire'), on => { allMaterials.forEach(m => { m.wireframe = on; }); });
$('btn-top').onclick = () => setMode(mode === 'top' ? 'orbit' : 'top');
$('btn-compare').onclick = () => setMode(mode === 'compare' ? 'orbit' : 'compare');
$('opacity').oninput = e => { compareEl.style.opacity = e.target.value; };
compareEl.style.opacity = 0.5;

$('btn-export').onclick = () => {
  new GLTFExporter().parse(beetle, glb => {
    const url = URL.createObjectURL(new Blob([glb], { type: 'model/gltf-binary' }));
    const a = Object.assign(document.createElement('a'), {
      href: url, download: `goliathus-regius-${headMale.visible ? 'male' : 'female'}.glb`,
    });
    a.click();
    URL.revokeObjectURL(url);
  }, err => console.error(err), { binary: true, onlyVisible: true });
};

if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
  controls.autoRotate = false;
  $('btn-rotate').setAttribute('aria-pressed', false);
}

// ================= 애니메이션 =================
const clock = new THREE.Clock();
let walkT = 0;
function animate() {
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;
  if (walking) walkT += dt * 5;
  for (const { g, phase } of legs) {
    const p = walkT + phase, amt = walking ? 1 : 0;
    g.rotation.y = amt * 0.14 * Math.sin(p);
    g.position.y = g.userData.y0 + amt * 1.2 * Math.max(0, Math.cos(p));
  }
  body.position.y = walking ? 0.4 * Math.abs(Math.sin(walkT)) : 0;
  for (const s of sides) {
    const a = s.userData.antenna;
    a.rotation.y = 0.06 * Math.sin(t * 1.7 + s.userData.side);
    a.rotation.z = 0.04 * Math.sin(t * 2.3);
  }
  if (mode === 'orbit') controls.update();
  renderer.render(scene, activeCamera);
  requestAnimationFrame(animate);
}

// 세로로 좁은 화면에서는 카메라를 뒤로 물려 전체가 보이게 한다
const BASE_DIST = camera.position.distanceTo(controls.target);
function fitView() {
  const aspect = window.innerWidth / window.innerHeight;
  camera.aspect = aspect;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  const dist = BASE_DIST / Math.min(1, aspect * 1.25);
  const dir = camera.position.clone().sub(controls.target).setLength(dist);
  camera.position.copy(controls.target).add(dir);
  controls.maxDistance = Math.max(500, dist * 1.5);
  if (mode !== 'orbit') layoutOrtho();
}
window.addEventListener('resize', fitView);
fitView();
setSex(true);
const params = new URLSearchParams(location.search);
if (params.has('compare')) setMode('compare');
else if (params.has('top')) setMode('top');
animate();
</script>
</body>
</html>
