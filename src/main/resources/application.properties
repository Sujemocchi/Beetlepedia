spring.application.name=Beetlepedia

# Schema is owned by Flyway (src/main/resources/db/migration); Hibernate only checks that the entities match it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
# Embedded columns are named after their attribute path, e.g. name.ko -> name_ko, size.male.max -> size_male_max.
spring.jpa.hibernate.naming.implicit-strategy=org.hibernate.boot.model.naming.ImplicitNamingStrategyComponentPathImpl
# Load lazy collections in batches instead of one query per entity (the API reads whole genera at once).
spring.jpa.properties.hibernate.default_batch_fetch_size=64

# Development database: a file in ./data (git-ignored), so edits made in the admin screen survive restarts.
# The seed is loaded only when the database is empty; delete ./data or use "시드에서 다시 불러오기" to start over.
spring.datasource.url=jdbc:h2:file:./data/beetlepedia

# Admin login (/admin). Set beetlepedia.admin.password (e.g. env BEETLEPEDIA_ADMIN_PASSWORD);
# without it a random password is generated and logged once at start-up.
beetlepedia.admin.username=admin
