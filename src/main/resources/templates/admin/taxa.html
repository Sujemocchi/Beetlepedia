<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/fragments :: head('분류군')}"></head>
<body class="admin">
<header th:replace="~{admin/fragments :: nav('taxa')}"></header>
<main class="container">
  <div th:replace="~{admin/fragments :: flash}"></div>
  <h1>분류군</h1>
  <section th:each="g : ${genera}" class="card-box">
    <div class="row-head">
      <h2><em class="sci" th:text="${g.sci}">Genus</em> <small th:text="${g.name}"></small></h2>
      <a class="chip small" th:href="@{/admin/taxa/new(genus=${g.id})}">+ 새 분류군</a>
    </div>
    <div class="table-wrap">
      <table class="admin-table">
        <thead><tr><th>학명</th><th>이름</th><th>계급</th><th>수컷 몸길이</th><th>분포</th><th>사진</th><th></th></tr></thead>
        <tbody>
          <tr th:each="x : ${g.taxa}">
            <td><span class="dot" th:style="'background:' + ${x.color}"></span><em class="sci" th:text="${x.sci}"></em></td>
            <td th:text="${x.name}"></td>
            <td th:text="${x.subspecies} ? '아종' : '종'"></td>
            <td class="num" th:text="${x.size}"></td>
            <td th:text="${x.distribution}"></td>
            <td class="num" th:text="${x.images}"></td>
            <td><a th:href="@{/admin/taxa/{id}(id=${x.id})}">편집</a> · <a th:href="@{/taxon.html(id=${x.id})}" target="_blank" rel="noopener">보기</a></td>
          </tr>
        </tbody>
      </table>
    </div>
  </section>
</main>
</body>
</html>
