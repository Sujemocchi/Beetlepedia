name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Gradle tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Test (schema, seed validation and export round trip, API, admin, static pages)
        run: ./gradlew test --console=plain
      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: build/reports/tests/test

  e2e:
    name: Browser checks
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 25
    env:
      BEETLEPEDIA_ADMIN_PASSWORD: ci-admin-password
      E2E_ADMIN_PASSWORD: ci-admin-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - name: Install Playwright
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Start the server
        run: |
          ./gradlew bootJar --console=plain
          nohup java -jar build/libs/*-SNAPSHOT.jar > server.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://localhost:8080/api/genera > /dev/null && exit 0
            sleep 2
          done
          cat server.log
          exit 1
      - name: Check pages (KO/EN/JA × 1280/375 px), search and admin
        working-directory: e2e
        run: node run.mjs
      - name: Server log
        if: always()
        run: cat server.log
